<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 140" role="img" aria-label="MORE-MOVIE">
  <title>MORE-MOVIE</title>

  <!--
    "M" va "REVIE" — tizim shrifti (Arial/Helvetica, bold) orqali chiziladi.
    Bu <img src="..."> ichida ham ishonchli ishlaydi, chunki tashqi shrift
    (Google Fonts) yuklashga urinmaydi — faqat brauzerda o'rnatilgan
    standart shrift ishlatiladi, shu bilan hamma joyda bir xil ko'rinadi.

    "O" halqasi va ichidagi qizil play tugmasi qo'lda vektor sifatida
    chizilgan — o'lchami "M" ning bosh harf balandligiga moslashtirilgan
    (radius 30 + stroke 20 => tashqi diametr 80, "M" cap-height'iga teng).
  -->

  <defs>
    <filter id="mm-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================= M — oq ================= -->
  <text x="2" y="112" font-family="Arial, Helvetica, sans-serif" font-weight="900"
        font-size="112" fill="#FFFFFF" filter="url(#mm-glow)">M</text>

  <!-- ================= O — halqa + ichida qizil play ================= -->
  <circle cx="140" cy="72" r="30" fill="none" stroke="#FFFFFF" stroke-width="20"
          filter="url(#mm-glow)"/>
  <polygon points="130,60 130,84 154,72" fill="#FF2A00"/>

  <!-- ================= RE / VIE — qizil, ikki qatorda ================= -->
  <text x="194" y="62" font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="52" letter-spacing="1" fill="#FF2A00">RE</text>
  <text x="194" y="120" font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="52" letter-spacing="1" fill="#FF2A00">VIE</text>
</svg>
