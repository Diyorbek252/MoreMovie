name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/moremovie:latest

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ~/more-movie
            git pull origin master
            .venv/bin/pip install -r requirements.txt
            .venv/bin/python manage.py migrate --noinput
            .venv/bin/python manage.py collectstatic --noinput
            sudo systemctl restart gunicorn

            # --- Frontend (Next.js) ---
            # SSH skripti interaktiv bo'lmagan shell'da ishlaydi — ~/.bashrc
            # dagi nvm u yerda yuklanmaydi, shuning uchun qo'lda yuklanadi.
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            cd ~/more-movie/frontend
            npm ci
            npm run build
            sudo systemctl restart more-movie-web
