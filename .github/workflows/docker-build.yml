name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/moremovie:latest

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ~/more-movie
            git pull origin master
            .venv/bin/pip install -r requirements.txt
            .venv/bin/python manage.py migrate --noinput
            .venv/bin/python manage.py collectstatic --noinput
            sudo systemctl restart gunicorn

            # --- Frontend (Next.js) ---
            # SSH skripti interaktiv bo'lmagan shell'da ishlaydi — ~/.bashrc
            # dagi nvm u yerda yuklanmaydi, shuning uchun qo'lda yuklanadi.
            # nvm.sh `set -u` (e'lon qilinmagan o'zgaruvchi = xato) bilan
            # mos emas — yuklash paytida vaqtincha o'chiriladi, aks holda
            # skript shu yerda jim to'xtaydi va Next qayta build bo'lmaydi.
            export NVM_DIR="$HOME/.nvm"
            set +u
            . "$NVM_DIR/nvm.sh"
            set -u
            cd ~/more-movie/frontend
            npm ci
            npm run build

            # Port 3000 ni systemd'dan TASHQARIDA ishga tushirilgan eski
            # jarayon (qo'lda `npm run start` / `nohup`) ushlab qolsa, yangi
            # xizmat EADDRINUSE bilan yiqiladi, `restart` esa buni sezmaydi —
            # sayt eski build'da qolib, JS chunk'lar 400 qaytaradi (bosh
            # sahifa qora). Shuning uchun portni majburan bo'shatamiz.
            sudo systemctl stop more-movie-web
            sudo fuser -k 3000/tcp || true
            # Oldingi yiqilishlardan keyin systemd "start request repeated
            # too quickly" deb bloklagan bo'lishi mumkin — hisoblagichni
            # nolga tushiramiz.
            sudo systemctl reset-failed more-movie-web || true
            sudo systemctl start more-movie-web

            # Tekshiruv: Next haqiqatan javob bermasa deploy QIZIL tugaydi.
            for i in $(seq 1 30); do
              curl -fsS -o /dev/null http://127.0.0.1:3000/ && break
              sleep 1
            done
            curl -fsS -o /dev/null http://127.0.0.1:3000/
            systemctl is-active --quiet more-movie-web
